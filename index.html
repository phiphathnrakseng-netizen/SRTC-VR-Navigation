<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Indoor Navigation UI</title>
    <!-- Google Fonts: Roboto for Material feel, Kanit for Thai -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #2563EB; /* Bright Blue */
            --accent-color: #F43F5E; /* Rose/Red for markers */
            --surface-color: rgba(255, 255, 255, 0.95);
            --glass-color: rgba(255, 255, 255, 0.7);
            --text-main: #1F2937;
            --text-sec: #6B7280;
            --radius-lg: 24px;
            --radius-md: 16px;
            --shadow-soft: 0 10px 30px rgba(0,0,0,0.1);
            --shadow-hard: 0 4px 12px rgba(0,0,0,0.15);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Kanit', 'Roboto', sans-serif;
            background-color: #111;
            overflow: hidden; /* Prevent scroll on mobile */
            height: 100vh;
            display: flex;
            justify-content: center;
        }

        /* --- Main Container (Mobile Screen Simulation) --- */
        .app-container {
            width: 100%;
            max-width: 480px; /* Mobile max width */
            height: 100%;
            background: #333;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        /* --- Simulated AR Camera Background --- */
        .ar-view {
            width: 100%;
            height: 100%;
            /* Placeholder Image imitating a building hallway */
            background-image: url('https://images.unsplash.com/photo-1505566938927-2c93d9326e5a?q=80&w=1000&auto=format&fit=crop'); 
            background-size: cover;
            background-position: center;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
            transition: var(--transition);
        }
        
        /* Simulated 2D Map (Hidden by default) */
        .map-view {
            width: 100%;
            height: 100%;
            background-color: #f0f2f5;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        .map-view.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 2; /* Bring above AR */
        }

        /* --- UI Layers --- */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through to map/ar */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        /* --- Top Bar --- */
        .top-bar {
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-top: 20px;
        }

        .search-box {
            background: var(--surface-color);
            padding: 12px 20px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            box-shadow: var(--shadow-soft);
            backdrop-filter: blur(10px);
        }

        .search-box input {
            border: none;
            background: transparent;
            margin-left: 10px;
            font-family: 'Kanit';
            font-size: 1rem;
            width: 100%;
            outline: none;
            color: var(--text-main);
        }

        .chips-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
            /* Hide scrollbar */
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .chips-container::-webkit-scrollbar { display: none; }

        .chip {
            background: var(--glass-color);
            backdrop-filter: blur(5px);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--text-main);
            white-space: nowrap;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: var(--transition);
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .chip.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        /* --- AR Markers (Floating Pins) --- */
        .ar-markers-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .ar-pin {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.3s ease;
        }
        
        /* Positioning example */
        .pin-1 { top: 40%; left: 30%; }
        .pin-2 { top: 35%; left: 70%; transform: scale(0.8); opacity: 0.8; }

        .pin-card {
            background: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            box-shadow: var(--shadow-hard);
            margin-bottom: 8px;
            opacity: 0;
            transform: translateY(10px);
            transition: var(--transition);
        }

        .ar-pin:hover .pin-card, .ar-pin.active .pin-card {
            opacity: 1;
            transform: translateY(0);
        }

        .pin-dot {
            width: 24px;
            height: 24px;
            background: var(--accent-color);
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 0 0 4px rgba(244, 63, 94, 0.3);
            animation: pulse 2s infinite;
        }
        
        .nav-line {
            /* Simulated AR Path line */
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 4px;
            height: 300px;
            background: linear-gradient(to top, var(--primary-color), transparent);
            transform: translateX(-50%) perspective(500px) rotateX(60deg);
            opacity: 0.8;
            pointer-events: none;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(244, 63, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); }
        }

        /* --- Bottom Sheet & Controls --- */
        .bottom-ui {
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: flex-end; /* Align FAB to right */
        }

        .view-toggle-btn {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: var(--text-main);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-soft);
            cursor: pointer;
            transition: var(--transition);
            border: none;
        }
        
        .view-toggle-btn:active {
            transform: scale(0.95);
        }

        .info-card {
            width: 100%;
            background: var(--surface-color);
            backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-soft);
            animation: slideUp 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .location-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .location-meta {
            font-size: 0.9rem;
            color: var(--text-sec);
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .distance-badge {
            background: #E0F2FE;
            color: #0284C7;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .action-btn {
            width: 100%;
            padding: 16px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-family: 'Kanit';
            font-size: 1rem;
            font-weight: 500;
            margin-top: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }
        
        .action-btn:hover {
            background: #1d4ed8;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* SVG Map Placeholder Style */
        .map-svg {
            width: 80%;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Layer 1: Simulated AR Camera View -->
        <div class="ar-view" id="arView">
            <div class="nav-line"></div> <!-- Simulated path on floor -->
        </div>

        <!-- Layer 2: 2D Map View (Hidden initially) -->
        <div class="map-view" id="mapView">
            <!-- Simple SVG Floorplan Placeholder -->
            <svg class="map-svg" viewBox="0 0 200 200">
                <path d="M20,20 L180,20 L180,180 L20,180 Z" fill="none" stroke="#94a3b8" stroke-width="4"/>
                <path d="M20,80 L180,80" stroke="#94a3b8" stroke-width="2"/>
                <path d="M100,20 L100,180" stroke="#94a3b8" stroke-width="2"/>
                <circle cx="100" cy="130" r="5" fill="#2563EB"/> <!-- User pos -->
                <circle cx="60" cy="50" r="5" fill="#F43F5E"/> <!-- Target -->
                <path d="M100,130 L100,80 L60,80 L60,50" stroke="#2563EB" stroke-width="2" stroke-dasharray="4"/>
            </svg>
        </div>

        <!-- Layer 3: Floating UI Elements -->
        <div class="ui-layer">
            
            <!-- Header Section -->
            <header class="top-bar">
                <div class="search-box">
                    <span class="material-icons-round" style="color:var(--text-sec)">search</span>
                    <input type="text" placeholder="ค้นหาห้อง, ร้านค้า, หรือแผนก...">
                    <span class="material-icons-round" style="color:var(--primary-color)">mic</span>
                </div>
                
                <div class="chips-container">
                    <div class="chip active">ทั้งหมด</div>
                    <div class="chip">ห้องน้ำ</div>
                    <div class="chip">ร้านกาแฟ</div>
                    <div class="chip">บันไดเลื่อน</div>
                    <div class="chip">ทางออก</div>
                </div>
            </header>

            <!-- AR Markers Layer (Only visible in AR mode) -->
            <div class="ar-markers-container" id="arMarkers">
                <!-- Example Pin 1 -->
                <div class="ar-pin pin-1 active" onclick="selectPin('ห้องประชุม A01', '50 ม.')">
                    <div class="pin-card">ห้องประชุม A01</div>
                    <div class="pin-dot"></div>
                </div>
                
                <!-- Example Pin 2 -->
                <div class="ar-pin pin-2" onclick="selectPin('Starbucks', '120 ม.')">
                    <div class="pin-card">Starbucks</div>
                    <div class="pin-dot" style="background: #059669; border-color:white;"></div>
                </div>
            </div>

            <!-- Bottom Section -->
            <footer class="bottom-ui">
                <!-- Toggle Button (AR vs Map) -->
                <button class="view-toggle-btn" onclick="toggleView()" id="toggleBtn">
                    <span class="material-icons-round">map</span>
                </button>

                <!-- Information Card -->
                <div class="info-card">
                    <div class="card-header">
                        <div>
                            <h2 class="location-title" id="targetName">ห้องประชุม A01</h2>
                            <div class="location-meta">
                                <span class="material-icons-round" style="font-size:16px;">layers</span>
                                ชั้น 2 • โซนการศึกษา
                            </div>
                        </div>
                        <div class="distance-badge" id="targetDist">50 ม.</div>
                    </div>
                    <p style="font-size:0.9rem; color:var(--text-sec); line-height:1.5;">
                        เดินตรงไป 30 เมตร แล้วเลี้ยวซ้าย ห้องจะอยู่ทางขวามือของคุณ
                    </p>
                    <button class="action-btn">
                        <span class="material-icons-round">navigation</span>
                        เริ่มนำทาง
                    </button>
                </div>
            </footer>
        </div>

    </div>

    <script>
        let isMapView = false;
        
        function toggleView() {
            const arView = document.getElementById('arView');
            const mapView = document.getElementById('mapView');
            const arMarkers = document.getElementById('arMarkers');
            const btnIcon = document.querySelector('#toggleBtn span');

            if (isMapView) {
                // Switch to AR
                mapView.classList.remove('active');
                arMarkers.style.opacity = '1';
                btnIcon.textContent = 'map';
            } else {
                // Switch to Map
                mapView.classList.add('active');
                arMarkers.style.opacity = '0';
                btnIcon.textContent = 'view_in_ar';
            }
            isMapView = !isMapView;
        }

        function selectPin(name, distance) {
            // Simple interaction to update text
            document.getElementById('targetName').textContent = name;
            document.getElementById('targetDist').textContent = distance;
            
            // Visual feedback on pins
            document.querySelectorAll('.ar-pin').forEach(p => p.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
