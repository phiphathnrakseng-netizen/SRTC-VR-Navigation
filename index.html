<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRTC VR Navigation</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        /* สไตล์เดิมของคุณ */
        :root {
            --primary: #c0392b;
            --secondary: #e67e22;
            --dark: #2c3e50;
            --light: #ecf0f1;
        }

        body {
            font-family: 'Kanit', sans-serif;
            margin: 0;
            background-color: var(--dark);
            color: white;
            overflow: hidden;
        }

        /* ส่วน UI เดิม */
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10; /* ให้อยู่เหนือกล้อง AR */
            background: linear-gradient(rgba(44, 62, 80, 0.8), rgba(44, 62, 80, 0.8));
            display: flex;
            flex-direction: column;
            transition: opacity 0.5s;
        }

        .header {
            padding: 20px;
            text-align: center;
            background: var(--primary);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .main-menu {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            padding: 20px;
            align-content: center;
        }

        .menu-item {
            background: rgba(255,255,255,0.1);
            border: 2px solid var(--secondary);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .menu-item:hover {
            background: var(--secondary);
            transform: translateY(-5px);
        }

        .menu-item i {
            font-size: 40px;
            margin-bottom: 10px;
            display: block;
        }

        /* ปุ่มปิด AR */
        #close-ar {
            display: none;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 18px;
            font-family: 'Kanit';
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div id="ui-container" class="ui-overlay">
        <div class="header">
            <h1>วิทยาลัยเทคนิคสุราษฎร์ธานี</h1>
            <p>ระบบนำทางเสมือนจริง (AR Navigation)</p>
        </div>

        <div class="main-menu">
            <div class="menu-item" onclick="startAR('ห้องพักครู')">
                <i class="fas fa-chalkboard-teacher"></i>
                <span>ห้องพักครู</span>
            </div>
            <div class="menu-item" onclick="startAR('ห้องทะเบียน')">
                <i class="fas fa-file-alt"></i>
                <span>ห้องทะเบียน</span>
            </div>
            <div class="menu-item" onclick="startAR('ห้องผู้อำนวยการ')">
                <i class="fas fa-user-tie"></i>
                <span>ห้องผู้อำนวยการ</span>
            </div>
            <div class="menu-item">
                <i class="fas fa-info-circle"></i>
                <span>เกี่ยวกับเรา</span>
            </div>
        </div>
    </div>

    <button id="close-ar" onclick="stopAR()">กลับหน้าเมนู</button>

    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;" 
        embedded
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-plane color="#e67e22" height="0.4" width="1.5" position="0 0.5 0" opacity="0.9"></a-plane>
            <a-text id="ar-text" value="กำลังไป: ห้องพักครู\nเดินตรงไป 10 เมตร" color="white" align="center" width="2.5" position="0 0.5 0.1"></a-text>
            <a-cone color="red" radius-bottom="0.1" radius-top="0" height="0.3" position="0 0.1 0" rotation="90 0 0"></a-cone>
        </a-entity>
    </a-scene>

    <script>
        const ui = document.getElementById('ui-container');
        const closeBtn = document.getElementById('close-ar');
        const sceneEl = document.querySelector('a-scene');
        const arText = document.getElementById('ar-text');

        function startAR(roomName) {
            // 1. ซ่อน UI เมนู
            ui.style.opacity = '0';
            setTimeout(() => { ui.style.display = 'none'; }, 500);
            
            // 2. แสดงปุ่มปิด
            closeBtn.style.display = 'block';
            
            // 3. เปลี่ยนข้อความใน AR ตามที่กด
            arText.setAttribute('value', `กำลังไป: ${roomName}\nเดินตรงไปตามลูกศร`);
            
            // 4. เริ่มระบบ AR
            const {systems} = sceneEl;
            systems['mindar-image-system'].start(); 
        }

        function stopAR() {
            // 1. ปิดระบบ AR กล้องจะหยุดทำงาน
            const {systems} = sceneEl;
            systems['mindar-image-system'].stop();
            
            // 2. แสดง UI เมนูคืนมา
            ui.style.display = 'flex';
            setTimeout(() => { ui.style.opacity = '1'; }, 10);
            
            // 3. ซ่อนปุ่มปิด
            closeBtn.style.display = 'none';
        }
    </script>
</body>
</html>
