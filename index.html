<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRTC Smart AR & Admin System</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@0.0.6"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/handpose@0.0.7"></script>
    
    <style>
        :root {
            --primary-blue: #002D72;
            --accent-blue: #0056D2;
            --bg-light: #F4F6F8;
            --text-dark: #1A1A1A;
            --text-grey: #666666;
            --danger: #d32f2f;
            --success: #2e7d32;
            --warning: #f57c00;
            --ar-color: #00FF88;
            --ar-marker: #FF4081;
            --ar-path: #00B0FF;
        }

        /* เพิ่ม CSS เดิมทั้งหมดที่นี่ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border-radius: 0 !important;
            font-family: 'Sarabun', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            overflow-x: hidden;
        }

        h1, h2, h3, h4, h5 {
            font-family: 'Kanit', sans-serif;
            font-weight: 600;
        }

        /* --- เพิ่มส่วนของ AR Enhancement --- */
        
        /* AR Performance Indicators */
        .ar-performance {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            z-index: 2005;
            display: none;
        }
        
        .ar-performance.active {
            display: block;
        }
        
        .performance-item {
            display: flex;
            justify-content: space-between;
            margin: 3px 0;
        }
        
        .performance-bar {
            width: 100px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            margin-left: 10px;
            position: relative;
        }
        
        .performance-fill {
            height: 100%;
            background: var(--ar-color);
            transition: width 0.3s;
        }
        
        /* AR Spatial Mapping */
        .ar-grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1998;
            display: none;
        }
        
        .ar-grid-line {
            position: absolute;
            background: rgba(0, 255, 136, 0.1);
        }
        
        .ar-grid-line.horizontal {
            width: 100%;
            height: 1px;
        }
        
        .ar-grid-line.vertical {
            height: 100%;
            width: 1px;
        }
        
        /* AR Object Styles (Enhanced) */
        .ar-object-3d {
            position: absolute;
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--ar-color), #00B0FF);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,255,136,0.3);
            animation: float3d 3s ease-in-out infinite;
            transform-style: preserve-3d;
            z-index: 2003;
            border: 2px solid white;
        }
        
        @keyframes float3d {
            0%, 100% { transform: translateY(0) rotateX(5deg); }
            50% { transform: translateY(-20px) rotateX(5deg); }
        }
        
        .ar-object-3d::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            background: linear-gradient(135deg, transparent, rgba(255,255,255,0.1), transparent);
            border-radius: 15px;
            z-index: -1;
            animation: shine 2s infinite;
        }
        
        @keyframes shine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        /* AR Surface Detection */
        .ar-surface {
            position: absolute;
            border: 2px dashed rgba(0, 176, 255, 0.5);
            background: rgba(0, 176, 255, 0.1);
            z-index: 2002;
        }
        
        .ar-surface.valid {
            border-color: var(--ar-color);
            background: rgba(0, 255, 136, 0.1);
        }
        
        /* AR Navigation Path (3D) */
        .ar-path-3d {
            position: absolute;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--ar-path), transparent);
            border-radius: 2px;
            box-shadow: 0 0 10px var(--ar-path);
            z-index: 2001;
            transform-style: preserve-3d;
        }
        
        .ar-path-node {
            position: absolute;
            width: 12px;
            height: 12px;
            background: var(--ar-path);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px var(--ar-path);
            animation: pulseNode 2s infinite;
        }
        
        @keyframes pulseNode {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.5); }
        }
        
        /* AR Debug Information */
        .ar-debug {
            position: absolute;
            bottom: 300px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.7rem;
            max-width: 300px;
            z-index: 2005;
            display: none;
        }
        
        .ar-debug.active {
            display: block;
        }
        
        .debug-section {
            margin: 5px 0;
            padding: 5px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        /* AR Gesture Guide */
        .ar-gesture-guide {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            z-index: 2010;
            display: none;
        }
        
        .gesture-icon {
            font-size: 3rem;
            margin-bottom: 10px;
            animation: gestureFloat 2s infinite;
        }
        
        @keyframes gestureFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        /* AR Minimap */
        .ar-minimap {
            position: absolute;
            top: 20px;
            right: 80px;
            width: 120px;
            height: 120px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            border: 2px solid var(--ar-color);
            overflow: hidden;
            z-index: 2004;
            display: none;
        }
        
        .minimap-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        .minimap-player {
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--ar-color);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px var(--ar-color);
        }
        
        .minimap-target {
            position: absolute;
            width: 6px;
            height: 6px;
            background: var(--ar-marker);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        
        /* AR Settings Panel */
        .ar-settings {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px;
            border-radius: 10px;
            z-index: 2006;
            display: none;
            min-width: 300px;
        }
        
        .ar-settings.active {
            display: block;
        }
        
        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
        }
        
        .settings-slider {
            width: 150px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            position: relative;
        }
        
        .settings-slider-fill {
            position: absolute;
            height: 100%;
            background: var(--ar-color);
            border-radius: 2px;
        }
        
        .settings-slider-handle {
            position: absolute;
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
        }
        
        /* AR Voice Control */
        .ar-voice-control {
            position: absolute;
            bottom: 200px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            z-index: 2004;
            cursor: pointer;
            border: 2px solid var(--ar-color);
            animation: voicePulse 2s infinite;
        }
        
        @keyframes voicePulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0,255,136,0.4); }
            50% { box-shadow: 0 0 0 10px rgba(0,255,136,0); }
        }
        
        /* AR Information Panel */
        .ar-info-panel {
            position: absolute;
            top: 100px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px;
            border-radius: 10px;
            max-width: 300px;
            z-index: 2004;
            display: none;
        }
        
        .ar-info-panel.active {
            display: block;
        }
        
        .info-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        
        /* CSS เดิมทั้งหมดที่เหลือ... */
        /* คัดลอก CSS เดิมทั้งหมดที่นี่ */
        
    </style>
</head>
<body>

        <h5 id="info-title">ชื่อวัตถุ</h5>

        <button onclick="navigateToObject()" class="btn btn-primary" style="width: 100%; margin-top: 10px;">

    <!-- คงส่วน HTML เดิมทั้งหมดไว้ -->
    <!-- รวมถึง navbar, pages, และ elements อื่นๆ ทั้งหมด -->

    <script>
        // ====== ข้อมูลและสถานะระบบ ======
        // ข้อมูลห้องเรียนและจุด AR (เดิม)
        let arPointsData = [
            { id: 1, floor: 4, name: "ห้องพักครู", desc: "Information Tech", icon: "user-tie", 
              steps: ["เดินไปยังบันไดทางขึ้น", "ขึ้นไปชั้น 4", "เลี้ยวซ้ายจากบันได", "เดินไปทางสุดห้อง"],
              coordinates: { x: 10, y: 5, z: 4 }, // เพิ่มพิกัด 3D
              type: "room",
              features: ["โต๊ะทำงาน", "คอมพิวเตอร์", "เอกสาร"]
            },
            // ... ข้อมูลอื่นๆ
        ];

        // สถานะระบบ AR (Enhanced)
        let arState = {
            isActive: false,
            currentDestination: null,
            videoStream: null,
            arObjects: [],
            arSurfaces: [],
            userPosition: { x: 0, y: 0, z: 0 },
            userRotation: { x: 0, y: 0, z: 0 },
            destinationPosition: { x: 10, y: 5, z: 0 },
            compassHeading: 0,
            is3DMode: true,
            model: null,
            poseDetector: null,
            handDetector: null,
            
            // เพิ่มสำหรับระบบ Enhanced
            environmentMap: [],
            detectedSurfaces: [],
            arAnchors: [],
            performanceStats: {
                fps: 0,
                gpuUsage: 0,
                memoryUsage: 0,
                detectionTime: 0
            },
            settings: {
                resolution: 0.8,
                brightness: 0.7,
                surfaceDetection: true,
                showGrid: false,
                showMinimap: true,
                voiceControl: false
            },
            voiceActive: false,
            lastUpdateTime: 0,
            frameCount: 0
        };

        // ====== ฟังก์ชัน AR Enhanced ======

        // 1. ระบบ Computer Vision ขั้นสูง
        async function initializeComputerVision() {
            try {
                // โหลดโมเดล MobileNet สำหรับตรวจจับวัตถุ
                arState.objectDetectionModel = await mobilenet.load({
                    version: 2,
                    alpha: 1.0
                });
                
                // โหลดโมเดลตรวจจับท่าทาง (Pose Detection)
                const detectorConfig = {
                    modelType: poseDetection.movenet.modelType.SINGLEPOSE_THUNDER,
                    enableSmoothing: true,
                    minPoseScore: 0.3
                };
                
                // กำหนดค่า WebGL backend สำหรับประสิทธิภาพสูงสุด
                await tf.setBackend('webgl');
                await tf.ready();
                
                console.log('Computer Vision systems initialized');
                return true;
            } catch (error) {
                console.error('Error initializing Computer Vision:', error);
                return false;
            }
        }

        // 2. ระบบ SLAM เบื้องต้น
        class SimpleSLAM {
            constructor() {
                this.keyframes = [];
                this.mapPoints = [];
                this.currentPose = { x: 0, y: 0, z: 0, rx: 0, ry: 0, rz: 0 };
                this.scale = 1.0;
            }
            
            addKeyframe(imageData, pose) {
                // จัดเก็บ keyframe และคำนวณ features
                const keyframe = {
                    id: this.keyframes.length,
                    timestamp: Date.now(),
                    pose: { ...pose },
                    features: this.extractFeatures(imageData)
                };
                
                this.keyframes.push(keyframe);
                this.updateMap();
            }
            
            extractFeatures(imageData) {
                // ใช้วิธีง่ายๆ สำหรับการตรวจจับ feature points
                const features = [];
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                canvas.width = 100;
                canvas.height = 100;
                ctx.drawImage(imageData, 0, 0, 100, 100);
                
                const imageDataSmall = ctx.getImageData(0, 0, 100, 100);
                
                // ตรวจจับจุดที่มีความต่างของสีสูง (corner detection เบื้องต้น)
                for (let y = 1; y < 99; y++) {
                    for (let x = 1; x < 99; x++) {
                        const idx = (y * 100 + x) * 4;
                        const intensity = this.getIntensity(imageDataSmall, idx);
                        
                        if (intensity > 200) { // จุดสว่างมาก
                            features.push({
                                x: x * (imageData.width / 100),
                                y: y * (imageData.height / 100),
                                score: intensity
                            });
                        }
                    }
                }
                
                return features;
            }
            
            getIntensity(imageData, index) {
                const r = imageData.data[index];
                const g = imageData.data[index + 1];
                const b = imageData.data[index + 2];
                return (r + g + b) / 3;
            }
            
            updateMap() {
                // อัพเดตแผนที่จาก keyframes
                if (this.keyframes.length > 1) {
                    const lastFrame = this.keyframes[this.keyframes.length - 1];
                    const prevFrame = this.keyframes[this.keyframes.length - 2];
                    
                    // จำลองการคำนวณการเคลื่อนไหว
                    const dx = lastFrame.pose.x - prevFrame.pose.x;
                    const dy = lastFrame.pose.y - prevFrame.pose.y;
                    
                    this.currentPose.x += dx;
                    this.currentPose.y += dy;
                }
            }
            
            getCurrentPose() {
                return { ...this.currentPose };
            }
        }

        // 3. ระบบ Pathfinding 3D
        class ARPathfinder3D {
            constructor() {
                this.gridSize = 0.5; // เมตร
                this.grid = {};
                this.path = [];
            }
            
            calculatePath(start, end, obstacles = []) {
                // ใช้ A* algorithm สำหรับ 3D
                const openSet = [start];
                const closedSet = [];
                const cameFrom = new Map();
                
                const gScore = new Map();
                const fScore = new Map();
                
                gScore.set(this.hashPoint(start), 0);
                fScore.set(this.hashPoint(start), this.heuristic(start, end));
                
                while (openSet.length > 0) {
                    // หา node ที่มี fScore น้อยที่สุด
                    let current = openSet[0];
                    let currentIndex = 0;
                    
                    for (let i = 1; i < openSet.length; i++) {
                        const node = openSet[i];
                        if (fScore.get(this.hashPoint(node)) < fScore.get(this.hashPoint(current))) {
                            current = node;
                            currentIndex = i;
                        }
                    }
                    
                    // ถ้าเจอจุดหมาย
                    if (this.pointsEqual(current, end)) {
                        return this.reconstructPath(cameFrom, current);
                    }
                    
                    openSet.splice(currentIndex, 1);
                    closedSet.push(current);
                    
                    // ดูเพื่อนบ้าน
                    const neighbors = this.getNeighbors(current, obstacles);
                    
                    for (const neighbor of neighbors) {
                        if (closedSet.some(p => this.pointsEqual(p, neighbor))) {
                            continue;
                        }
                        
                        const tentativeGScore = gScore.get(this.hashPoint(current)) + 
                                              this.distance(current, neighbor);
                        
                        if (!openSet.some(p => this.pointsEqual(p, neighbor))) {
                            openSet.push(neighbor);
                        } else if (tentativeGScore >= gScore.get(this.hashPoint(neighbor))) {
                            continue;
                        }
                        
                        cameFrom.set(this.hashPoint(neighbor), current);
                        gScore.set(this.hashPoint(neighbor), tentativeGScore);
                        fScore.set(this.hashPoint(neighbor), 
                                 tentativeGScore + this.heuristic(neighbor, end));
                    }
                }
                
                return []; // ไม่พบ path
            }
            
            getNeighbors(point, obstacles) {
                const neighbors = [];
                const directions = [
                    { x: this.gridSize, y: 0, z: 0 },
                    { x: -this.gridSize, y: 0, z: 0 },
                    { x: 0, y: this.gridSize, z: 0 },
                    { x: 0, y: -this.gridSize, z: 0 },
                    { x: 0, y: 0, z: this.gridSize },
                    { x: 0, y: 0, z: -this.gridSize }
                ];
                
                for (const dir of directions) {
                    const neighbor = {
                        x: point.x + dir.x,
                        y: point.y + dir.y,
                        z: point.z + dir.z
                    };
                    
                    // ตรวจสอบว่าไม่ชน obstacles
                    let isValid = true;
                    for (const obstacle of obstacles) {
                        if (this.distance(neighbor, obstacle) < this.gridSize * 0.5) {
                            isValid = false;
                            break;
                        }
                    }
                    
                    if (isValid) {
                        neighbors.push(neighbor);
                    }
                }
                
                return neighbors;
            }
            
            heuristic(a, b) {
                return Math.sqrt(
                    Math.pow(a.x - b.x, 2) +
                    Math.pow(a.y - b.y, 2) +
                    Math.pow(a.z - b.z, 2)
                );
            }
            
            distance(a, b) {
                return this.heuristic(a, b);
            }
            
            pointsEqual(a, b) {
                return a.x === b.x && a.y === b.y && a.z === b.z;
            }
            
            hashPoint(point) {
                return `${Math.round(point.x/this.gridSize)}_${Math.round(point.y/this.gridSize)}_${Math.round(point.z/this.gridSize)}`;
            }
            
            reconstructPath(cameFrom, current) {
                const path = [current];
                while (cameFrom.has(this.hashPoint(current))) {
                    current = cameFrom.get(this.hashPoint(current));
                    path.unshift(current);
                }
                return path;
            }
        }

        // 4. ระบบ Surface Detection
        class SurfaceDetector {
            constructor() {
                this.surfaces = [];
                this.planeDetector = null;
            }
            
            async detectSurfaces(videoElement) {
                // ใช้ computer vision เบื้องต้นสำหรับตรวจจับพื้นผิว
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                canvas.width = videoElement.videoWidth;
                canvas.height = videoElement.videoHeight;
                
                ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                
                return this.detectPlanes(imageData);
            }
            
            detectPlanes(imageData) {
                const planes = [];
                const width = imageData.width;
                const height = imageData.height;
                
                // ตรวจจับขอบ (edge detection)
                const edges = this.detectEdges(imageData);
                
                // หาเส้นตรงจากขอบ (Hough Transform เบื้องต้น)
                for (let y = 0; y < height; y += 10) {
                    for (let x = 0; x < width; x += 10) {
                        if (edges[y * width + x] > 128) {
                            const line = this.findLineAtPoint(edges, width, height, x, y);
                            if (line) {
                                planes.push({
                                    points: line.points,
                                    normal: line.normal,
                                    confidence: line.confidence
                                });
                            }
                        }
                    }
                }
                
                // รวมพื้นผิวที่ใกล้เคียงกัน
                return this.mergeSimilarPlanes(planes);
            }
            
            detectEdges(imageData) {
                // Sobel edge detection เบื้องต้น
                const width = imageData.width;
                const height = imageData.height;
                const data = imageData.data;
                const edges = new Uint8Array(width * height);
                
                const kernelX = [
                    [-1, 0, 1],
                    [-2, 0, 2],
                    [-1, 0, 1]
                ];
                
                const kernelY = [
                    [-1, -2, -1],
                    [0, 0, 0],
                    [1, 2, 1]
                ];
                
                for (let y = 1; y < height - 1; y++) {
                    for (let x = 1; x < width - 1; x++) {
                        let gx = 0, gy = 0;
                        
                        for (let ky = -1; ky <= 1; ky++) {
                            for (let kx = -1; kx <= 1; kx++) {
                                const idx = ((y + ky) * width + (x + kx)) * 4;
                                const intensity = (data[idx] + data[idx + 1] + data[idx + 2]) / 3;
                                
                                gx += intensity * kernelX[ky + 1][kx + 1];
                                gy += intensity * kernelY[ky + 1][kx + 1];
                            }
                        }
                        
                        const magnitude = Math.sqrt(gx * gx + gy * gy);
                        edges[y * width + x] = Math.min(255, magnitude);
                    }
                }
                
                return edges;
            }
            
            findLineAtPoint(edges, width, height, x, y) {
                // หาเส้นตรงจากจุดเริ่มต้น
                const maxDistance = 100;
                const points = [];
                
                // ตรวจสอบหลายทิศทาง
                for (let angle = 0; angle < 180; angle += 15) {
                    const rad = angle * Math.PI / 180;
                    const dx = Math.cos(rad);
                    const dy = Math.sin(rad);
                    
                    const linePoints = [];
                    for (let d = -maxDistance; d <= maxDistance; d += 5) {
                        const px = Math.round(x + dx * d);
                        const py = Math.round(y + dy * d);
                        
                        if (px >= 0 && px < width && py >= 0 && py < height) {
                            if (edges[py * width + px] > 128) {
                                linePoints.push({ x: px, y: py });
                            }
                        }
                    }
                    
                    if (linePoints.length > 20) { // พบเส้นตรง
                        return {
                            points: linePoints,
                            normal: { x: -dy, y: dx },
                            confidence: linePoints.length / (maxDistance * 2)
                        };
                    }
                }
                
                return null;
            }
            
            mergeSimilarPlanes(planes) {
                // รวมพื้นผิวที่ใกล้เคียงกัน
                const merged = [];
                
                for (const plane of planes) {
                    let mergedWithExisting = false;
                    
                    for (const existing of merged) {
                        if (this.planesAreSimilar(plane, existing)) {
                            existing.points = existing.points.concat(plane.points);
                            existing.confidence = Math.max(existing.confidence, plane.confidence);
                            mergedWithExisting = true;
                            break;
                        }
                    }
                    
                    if (!mergedWithExisting) {
                        merged.push({ ...plane });
                    }
                }
                
                return merged;
            }
            
            planesAreSimilar(plane1, plane2) {
                // ตรวจสอบความคล้ายคลึงของพื้นผิว
                const angleDiff = Math.abs(
                    Math.atan2(plane1.normal.y, plane1.normal.x) - 
                    Math.atan2(plane2.normal.y, plane2.normal.x)
                );
                
                return angleDiff < Math.PI / 6; // 30 องศา
            }
        }

        // ====== เริ่มต้นระบบ Enhanced AR ======
        async function initializeEnhancedAR() {
            console.log('Initializing Enhanced AR System...');
            
            // 1. เริ่มต้น Computer Vision
            const cvSuccess = await initializeComputerVision();
            if (!cvSuccess) {
                console.warn('Computer Vision initialization failed, using basic AR');
            }
            
            // 2. เริ่มต้น SLAM
            arState.slam = new SimpleSLAM();
            
            // 3. เริ่มต้น Pathfinder
            arState.pathfinder = new ARPathfinder3D();
            
            // 4. เริ่มต้น Surface Detector
            arState.surfaceDetector = new SurfaceDetector();
            
            // 5. เริ่มต้นระบบ Performance Monitoring
            initializePerformanceMonitoring();
            
            // 6. เริ่มต้นระบบ Voice Control
            initializeVoiceControl();
            
            console.log('Enhanced AR System initialized');
        }

        // ====== ระบบ Performance Monitoring ======
        function initializePerformanceMonitoring() {
            // เริ่มต้นการติดตาม performance
            let lastTime = performance.now();
            let frames = 0;
            
            function updatePerformance() {
                frames++;
                const currentTime = performance.now();
                
                if (currentTime >= lastTime + 1000) {
                    arState.performanceStats.fps = Math.round((frames * 1000) / (currentTime - lastTime));
                    frames = 0;
                    lastTime = currentTime;
                    
                    // อัพเดต GPU usage (จำลอง)
                    arState.performanceStats.gpuUsage = Math.min(100, 
                        Math.round(30 + Math.random() * 40 + arState.arObjects.length * 5));
                    
                    // อัพเดต memory usage (จำลอง)
                    arState.performanceStats.memoryUsage = Math.min(100,
                        Math.round(20 + Math.random() * 30 + arState.environmentMap.length * 2));
                    
                    updatePerformanceUI();
                }
                
                if (arState.isActive) {
                    requestAnimationFrame(updatePerformance);
                }
            }
            
            updatePerformance();
        }
        
        function updatePerformanceUI() {
            const perf = arState.performanceStats;
            
            document.getElementById('fps-text').textContent = perf.fps;
            document.getElementById('fps-bar').style.width = Math.min(100, perf.fps) + '%';
            
            document.getElementById('gpu-text').textContent = perf.gpuUsage + '%';
            document.getElementById('gpu-bar').style.width = perf.gpuUsage + '%';
            
            document.getElementById('memory-text').textContent = perf.memoryUsage + '%';
            document.getElementById('memory-bar').style.width = perf.memoryUsage + '%';
            
            // แสดง performance panel
            document.getElementById('ar-performance').classList.add('active');
        }

        // ====== ระบบ Voice Control ======
        function initializeVoiceControl() {
            // ตรวจสอบการรองรับ Web Speech API
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                arState.speechRecognition = new SpeechRecognition();
                
                arState.speechRecognition.continuous = true;
                arState.speechRecognition.interimResults = true;
                arState.speechRecognition.lang = 'th-TH';
                
                arState.speechRecognition.onresult = handleVoiceCommand;
                arState.speechRecognition.onerror = handleVoiceError;
                
                console.log('Voice control initialized');
            } else {
                console.warn('Web Speech API not supported');
            }
        }
        
        function toggleVoiceControl() {
            if (!arState.speechRecognition) {
                alert('ระบบเสียงไม่รองรับบนเบราว์เซอร์นี้');
                return;
            }
            
            arState.voiceActive = !arState.voiceActive;
            
            if (arState.voiceActive) {
                arState.speechRecognition.start();
                document.getElementById('ar-voice-control').innerHTML = '<i class="fas fa-microphone-slash"></i>';
                document.getElementById('ar-voice-control').style.background = 'rgba(255,0,0,0.7)';
                
                showGestureGuide('เสียง', 'พูดคำสั่ง เช่น "นำทางไปห้องพักครู"');
            } else {
                arState.speechRecognition.stop();
                document.getElementById('ar-voice-control').innerHTML = '<i class="fas fa-microphone"></i>';
                document.getElementById('ar-voice-control').style.background = 'rgba(0,0,0,0.7)';
            }
        }
        
        function handleVoiceCommand(event) {
            const transcript = Array.from(event.results)
                .map(result => result[0])
                .map(result => result.transcript)
                .join('');
            
            const commands = {
                'นำทาง': handleNavigationCommand,
                'หยุด': stopAR,
                'ซูม': handleZoomCommand,
                'หมุน': handleRotationCommand,
                'ข้อมูล': handleInfoCommand
            };
            
            for (const [keyword, handler] of Object.entries(commands)) {
                if (transcript.includes(keyword)) {
                    handler(transcript);
                    break;
                }
            }
        }
        
        function handleNavigationCommand(transcript) {
            // หาห้องจากคำสั่งเสียง
            for (const room of arPointsData) {
                if (transcript.includes(room.name)) {
                    startAR(room.name);
                    break;
                }
            }
        }
        
        function handleVoiceError(error) {
            console.error('Voice recognition error:', error);
        }

        // ====== ระบบ Gesture Guide ======
        function showGestureGuide(title, description, duration = 3000) {
            document.getElementById('gesture-title').textContent = title;
            document.getElementById('gesture-desc').textContent = description;
            document.getElementById('ar-gesture-guide').style.display = 'block';
            
            setTimeout(() => {
                document.getElementById('ar-gesture-guide').style.display = 'none';
            }, duration);
        }

        // ====== ระบบ Minimap ======
        function updateMinimap() {
            const minimap = document.getElementById('ar-minimap');
            const player = document.getElementById('minimap-player');
            const target = document.getElementById('minimap-target');
            
            if (!minimap || !player || !target) return;
            
            // อัพเดตตำแหน่งผู้ใช้
            const userX = arState.userPosition.x;
            const userY = arState.userPosition.y;
            
            // แปลงตำแหน่งเป็นพิกัด minimap (120x120)
            const mapSize = 120;
            const worldSize = 20; // เมตร
            
            const playerX = (userX / worldSize) * mapSize;
            const playerY = (userY / worldSize) * mapSize;
            
            player.style.left = `${playerX}px`;
            player.style.top = `${playerY}px`;
            
            // อัพเดตตำแหน่งเป้าหมาย
            const targetRoom = arPointsData.find(r => r.name === arState.currentDestination);
            if (targetRoom && targetRoom.coordinates) {
                const targetX = (targetRoom.coordinates.x / worldSize) * mapSize;
                const targetY = (targetRoom.coordinates.y / worldSize) * mapSize;
                
                target.style.left = `${targetX}px`;
                target.style.top = `${targetY}px`;
            }
            
            // แสดง minimap
            if (arState.settings.showMinimap) {
                minimap.style.display = 'block';
            }
        }

        // ====== ระบบ Surface Detection แบบ real-time ======
        async function detectSurfacesInRealTime() {
            if (!arState.settings.surfaceDetection) return;
            
            const video = document.getElementById('ar-video');
            if (!video || video.readyState !== 4) return;
            
            try {
                const surfaces = await arState.surfaceDetector.detectSurfaces(video);
                arState.detectedSurfaces = surfaces;
                
                // สร้าง visual representation ของพื้นผิว
                renderDetectedSurfaces(surfaces);
                
                // อัพเดต environment map
                updateEnvironmentMap(surfaces);
            } catch (error) {
                console.error('Surface detection error:', error);
            }
        }
        
        function renderDetectedSurfaces(surfaces) {
            // ลบพื้นผิวเก่า
            document.querySelectorAll('.ar-surface').forEach(el => el.remove());
            arState.arSurfaces = [];
            
            // สร้างพื้นผิวใหม่
            surfaces.forEach((surface, index) => {
                if (surface.points.length < 10) return;
                
                // คำนวณขอบเขตของพื้นผิว
                const bounds = calculateSurfaceBounds(surface.points);
                
                // สร้าง element สำหรับพื้นผิว
                const surfaceElement = document.createElement('div');
                surfaceElement.className = `ar-surface ${surface.confidence > 0.5 ? 'valid' : ''}`;
                surfaceElement.style.left = `${bounds.x}%`;
                surfaceElement.style.top = `${bounds.y}%`;
                surfaceElement.style.width = `${bounds.width}%`;
                surfaceElement.style.height = `${bounds.height}%`;
                surfaceElement.title = `พื้นผิว ${index + 1} (ความมั่นใจ: ${Math.round(surface.confidence * 100)}%)`;
                
                document.getElementById('ar-viewport').appendChild(surfaceElement);
                arState.arSurfaces.push(surfaceElement);
            });
        }
        
        function calculateSurfaceBounds(points) {
            if (points.length === 0) return { x: 0, y: 0, width: 0, height: 0 };
            
            let minX = Infinity, maxX = -Infinity;
            let minY = Infinity, maxY = -Infinity;
            
            points.forEach(point => {
                minX = Math.min(minX, point.x);
                maxX = Math.max(maxX, point.x);
                minY = Math.min(minY, point.y);
                maxY = Math.max(maxY, point.y);
            });
            
            const video = document.getElementById('ar-video');
            const width = video.videoWidth;
            const height = video.videoHeight;
            
            return {
                x: (minX / width) * 100,
                y: (minY / height) * 100,
                width: ((maxX - minX) / width) * 100,
                height: ((maxY - minY) / height) * 100
            };
        }
        
        function updateEnvironmentMap(surfaces) {
            surfaces.forEach(surface => {
                arState.environmentMap.push({
                    type: 'surface',
                    points: surface.points,
                    normal: surface.normal,
                    timestamp: Date.now()
                });
            });
            
            // เก็บเฉพาะข้อมูลล่าสุด
            if (arState.environmentMap.length > 100) {
                arState.environmentMap = arState.environmentMap.slice(-100);
            }
        }

        // ====== ระบบ Object Detection ขั้นสูง ======
        async function detectObjectsInScene() {
            if (!arState.objectDetectionModel) return;
            
            const video = document.getElementById('ar-video');
            if (!video || video.readyState !== 4) return;
            
            try {
                const predictions = await arState.objectDetectionModel.classify(video);
                
                // กรองเฉพาะวัตถุที่เกี่ยวข้อง
                const relevantObjects = predictions.filter(p => 
                    p.probability > 0.5 && 
                    ['chair', 'desk', 'door', 'person', 'computer', 'book'].includes(p.className.toLowerCase())
                );
                
                // สร้าง AR objects จากวัตถุที่ตรวจจับได้
                createARObjectsFromDetections(relevantObjects);
            } catch (error) {
                console.error('Object detection error:', error);
            }
        }
        
        function createARObjectsFromDetections(detections) {
            // สร้างวัตถุ AR จากวัตถุที่ตรวจจับได้
            detections.forEach((detection, index) => {
                // สุ่มตำแหน่งบนหน้าจอ
                const x = 0.2 + Math.random() * 0.6;
                const y = 0.2 + Math.random() * 0.6;
                
                const arObject = {
                    id: `detected-${index}`,
                    x: x,
                    y: y,
                    type: 'detected',
                    className: detection.className,
                    confidence: detection.probability,
                    element: null
                };
                
                // สร้าง element
                const objElement = document.createElement('div');
                objElement.className = 'ar-object-3d';
                objElement.id = `ar-object-detected-${index}`;
                objElement.style.left = `${x * 100}%`;
                objElement.style.top = `${y * 100}%`;
                objElement.innerHTML = `<i class="fas fa-${getIconForObject(detection.className)}"></i>`;
                objElement.onclick = () => showObjectInfo(detection);
                
                document.getElementById('ar-viewport').appendChild(objElement);
                arObject.element = objElement;
                
                arState.arObjects.push(arObject);
            });
        }
        
        function getIconForObject(className) {
            const iconMap = {
                'chair': 'chair',
                'desk': 'table',
                'door': 'door-closed',
                'person': 'user',
                'computer': 'desktop',
                'book': 'book'
            };
            
            return iconMap[className.toLowerCase()] || 'cube';
        }
        
        function showObjectInfo(detection) {
            document.getElementById('info-title').textContent = `วัตถุ: ${detection.className}`;
            document.getElementById('info-desc').textContent = `ตรวจจับได้ด้วยความมั่นใจ ${Math.round(detection.probability * 100)}%`;
            
            document.getElementById('ar-info-panel').classList.add('active');
        }

        // ====== ระบบ Pathfinding ขั้นสูง ======
        function calculate3DPath() {
            if (!arState.pathfinder || !arState.currentDestination) return;
            
            const targetRoom = arPointsData.find(r => r.name === arState.currentDestination);
            if (!targetRoom || !targetRoom.coordinates) return;
            
            // สร้าง obstacles จาก environment map
            const obstacles = arState.environmentMap
                .filter(item => item.type === 'surface')
                .map(item => ({
                    x: item.points[0]?.x || 0,
                    y: item.points[0]?.y || 0,
                    z: 0
                }));
            
            // คำนวณ path
            const path = arState.pathfinder.calculatePath(
                arState.userPosition,
                targetRoom.coordinates,
                obstacles
            );
            
            // แสดง path
            render3DPath(path);
            
            return path;
        }
        
        function render3DPath(path) {
            // ลบ path เก่า
            document.querySelectorAll('.ar-path-3d, .ar-path-node').forEach(el => el.remove());
            
            // สร้าง path ใหม่
            for (let i = 0; i < path.length - 1; i++) {
                const point1 = path[i];
                const point2 = path[i + 1];
                
                // คำนวณตำแหน่งบนหน้าจอ (จำลอง)
                const screenX1 = 0.5 + point1.x * 0.02;
                const screenY1 = 0.5 - point1.y * 0.02;
                const screenX2 = 0.5 + point2.x * 0.02;
                const screenY2 = 0.5 - point2.y * 0.02;
                
                // สร้างเส้นทาง
                const pathElement = document.createElement('div');
                pathElement.className = 'ar-path-3d';
                
                // คำนวณความยาวและมุม
                const dx = screenX2 - screenX1;
                const dy = screenY2 - screenY1;
                const length = Math.sqrt(dx * dx + dy * dy) * 100;
                const angle = Math.atan2(dy, dx) * 180 / Math.PI;
                
                pathElement.style.width = `${length}%`;
                pathElement.style.left = `${screenX1 * 100}%`;
                pathElement.style.top = `${screenY1 * 100}%`;
                pathElement.style.transform = `rotate(${angle}deg)`;
                pathElement.style.transformOrigin = '0 0';
                
                document.getElementById('ar-viewport').appendChild(pathElement);
                
                // สร้าง node ที่จุดเริ่มต้น
                if (i === 0) {
                    const nodeElement = document.createElement('div');
                    nodeElement.className = 'ar-path-node';
                    nodeElement.style.left = `${screenX1 * 100}%`;
                    nodeElement.style.top = `${screenY1 * 100}%`;
                    document.getElementById('ar-viewport').appendChild(nodeElement);
                }
            }
            
            // สร้าง node ที่จุดสิ้นสุด
            if (path.length > 0) {
                const lastPoint = path[path.length - 1];
                const screenX = 0.5 + lastPoint.x * 0.02;
                const screenY = 0.5 - lastPoint.y * 0.02;
                
                const nodeElement = document.createElement('div');
                nodeElement.className = 'ar-path-node';
                nodeElement.style.left = `${screenX * 100}%`;
                nodeElement.style.top = `${screenY * 100}%`;
                document.getElementById('ar-viewport').appendChild(nodeElement);
            }
        }

        // ====== การปรับปรุงฟังก์ชัน startAR ======
        async function startAREnhanced(destinationName = "อาคารเรียน 6") {
            // เริ่มต้นระบบ Enhanced AR
            await initializeEnhancedAR();
            
            // เรียกฟังก์ชัน startAR เดิม
            return startAR(destinationName);
        }

        // ====== การปรับปรุง AR Update Loop ======
        function enhancedARUpdateLoop() {
            if (!arState.isActive) return;
            
            const currentTime = performance.now();
            
            // อัพเดต performance
            arState.frameCount++;
            if (currentTime - arState.lastUpdateTime > 1000) {
                arState.performanceStats.fps = Math.round(
                    (arState.frameCount * 1000) / (currentTime - arState.lastUpdateTime)
                );
                arState.frameCount = 0;
                arState.lastUpdateTime = currentTime;
                updatePerformanceUI();
            }
            
            // อัพเดต SLAM
            if (arState.videoStream && arState.slam) {
                const video = document.getElementById('ar-video');
                if (video.readyState === 4) {
                    // เพิ่ม keyframe ทุก 1 วินาที
                    if (currentTime % 1000 < 16) { // ประมาณ 60fps
                        const pose = {
                            x: arState.userPosition.x + (Math.random() - 0.5) * 0.1,
                            y: arState.userPosition.y + (Math.random() - 0.5) * 0.1,
                            z: arState.userPosition.z
                        };
                        
                        arState.slam.addKeyframe(video, pose);
                        arState.userPosition = arState.slam.getCurrentPose();
                    }
                }
            }
            
            // อัพเดต minimap
            updateMinimap();
            
            // อัพเดต compass
            updateCompassEnhanced();
            
            // ตรวจจับพื้นผิว (ทุก 2 วินาที)
            if (currentTime % 2000 < 16 && arState.settings.surfaceDetection) {
                detectSurfacesInRealTime();
            }
            
            // ตรวจจับวัตถุ (ทุก 3 วินาที)
            if (currentTime % 3000 < 16) {
                detectObjectsInScene();
            }
            
            // คำนวณ path ใหม่ (ทุก 5 วินาที)
            if (currentTime % 5000 < 16) {
                calculate3DPath();
            }
            
            // อัพเดตวัตถุ AR
            updateARObjectsEnhanced();
            
            requestAnimationFrame(enhancedARUpdateLoop);
        }
        
        function updateCompassEnhanced() {
            const compass = document.getElementById('ar-compass');
            if (compass) {
                // ใช้ข้อมูลจาก device orientation หรือ SLAM
                const rotation = arState.slam ? 
                    arState.slam.getCurrentPose().rz * 180 / Math.PI : 
                    (Date.now() / 100) % 360;
                
                compass.style.transform = `rotate(${rotation}deg)`;
                
                // อัพเดต distance indicator
                if (arState.currentDestination) {
                    const targetRoom = arPointsData.find(r => r.name === arState.currentDestination);
                    if (targetRoom && targetRoom.coordinates) {
                        const distance = Math.sqrt(
                            Math.pow(arState.userPosition.x - targetRoom.coordinates.x, 2) +
                            Math.pow(arState.userPosition.y - targetRoom.coordinates.y, 2)
                        );
                        
                        document.getElementById('distance-text').textContent = 
                            `เหลือ ${Math.round(distance)} เมตร`;
                    }
                }
            }
        }
        
        function updateARObjectsEnhanced() {
            arState.arObjects.forEach((obj, index) => {
                if (obj.element) {
                    // การเคลื่อนไหวที่ซับซ้อนขึ้น
                    const time = Date.now() / 1000;
                    const offsetX = Math.sin(time + index) * 3;
                    const offsetY = Math.cos(time * 0.7 + index) * 3;
                    
                    obj.element.style.transform = `translate(${offsetX}px, ${offsetY}px) rotateY(${time * 30}deg)`;
                    
                    // การเปลี่ยนแปลงสีตามระยะทาง
                    const distanceToUser = Math.sqrt(
                        Math.pow(obj.x - arState.userPosition.x, 2) +
                        Math.pow(obj.y - arState.userPosition.y, 2)
                    );
                    
                    const intensity = Math.max(0.3, 1 - distanceToUser / 20);
                    obj.element.style.opacity = intensity;
                }
            });
        }

        // ====== ฟังก์ชันเสริม ======
        function toggleARSettings() {
            document.getElementById('ar-settings').classList.toggle('active');
        }
        
        function closeARSettings() {
            document.getElementById('ar-settings').classList.remove('active');
            
            // อัพเดตการตั้งค่าจาก UI
            arState.settings.resolution = parseFloat(
                document.querySelector('#resolution-slider .settings-slider-handle').style.left
            ) / 100;
            
            arState.settings.brightness = parseFloat(
                document.querySelector('#brightness-slider .settings-slider-handle').style.left
            ) / 100;
            
            arState.settings.surfaceDetection = document.getElementById('surface-detection').checked;
            arState.settings.showGrid = document.getElementById('show-grid').checked;
            
            // อัพเดต video stream ตามการตั้งค่า
            updateVideoSettings();
        }
        
        function updateVideoSettings() {
            if (arState.videoStream) {
                const videoTrack = arState.videoStream.getVideoTracks()[0];
                const constraints = videoTrack.getConstraints();
                
                // อัพเดต constraints ตามการตั้งค่า
                constraints.width = { ideal: 1280 * arState.settings.resolution };
                constraints.height = { ideal: 720 * arState.settings.resolution };
                
                videoTrack.applyConstraints(constraints);
            }
        }
        
        function closeInfoPanel() {
            document.getElementById('ar-info-panel').classList.remove('active');
        }
        
        function navigateToObject() {
            const objectName = document.getElementById('info-title').textContent;
            alert(`กำลังนำทางไปยัง: ${objectName}`);
            closeInfoPanel();
        }

        // ====== การปรับปรุงฟังก์ชันเริ่มต้น ======
        window.onload = function() {
            // เรียกฟังก์ชันเดิม
            if(localStorage.getItem('siteContent')) {
                const content = JSON.parse(localStorage.getItem('siteContent'));
                updateHomeUI(content.title, content.subtitle, content.desc);
            }
            renderFloorList();
            
            // เริ่มต้นระบบตรวจจับการเคลื่อนไหว
            initializeMotionDetection();
            
            // เพิ่ม event listeners สำหรับ AR enhanced
            document.addEventListener('keydown', handleKeyPress);
            
            // เริ่มต้นระบบ performance monitoring
            initializePerformanceMonitoring();
        };

        function handleKeyPress(event) {
            if (!arState.isActive) return;
            
            switch(event.key) {
                case ' ':
                    // สเปซบาร์: จับภาพสภาพแวดล้อม
                    captureEnvironment();
                    break;
                case 'ArrowUp':
                    // ลูกศรขึ้น: เคลื่อนที่ไปข้างหน้า
                    arState.userPosition.y += 0.5;
                    break;
                case 'ArrowDown':
                    // ลูกศรลง: เคลื่อนที่ไปข้างหลัง
                    arState.userPosition.y -= 0.5;
                    break;
                case 'ArrowLeft':
                    // ลูกศรซ้าย: หมุนซ้าย
                    arState.userRotation.y -= 10;
                    break;
                case 'ArrowRight':
                    // ลูกศรขวา: หมุนขวา
                    arState.userRotation.y += 10;
                    break;
                case 'm':
                    // m: เปิด/ปิด minimap
                    arState.settings.showMinimap = !arState.settings.showMinimap;
                    document.getElementById('ar-minimap').style.display = 
                        arState.settings.showMinimap ? 'block' : 'none';
                    break;
                case 'g':
                    // g: เปิด/ปิด grid
                    arState.settings.showGrid = !arState.settings.showGrid;
                    document.getElementById('ar-grid-overlay').style.display = 
                        arState.settings.showGrid ? 'block' : 'none';
                    break;
            }
        }
        
        function captureEnvironment() {
            // จับภาพและเพิ่มลงใน environment map
            const video = document.getElementById('ar-video');
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);
            
            // แสดงข้อความยืนยัน
            showGestureGuide('บันทึกสภาพแวดล้อม', 'บันทึกสภาพแวดล้อมสำเร็จ', 2000);
            
            console.log('Environment captured:', canvas.width, 'x', canvas.height);
        }

        // ====== การแทนที่ฟังก์ชันเริ่มต้น AR ด้วยเวอร์ชัน Enhanced ======
        // เก็บฟังก์ชันเดิมไว้
        const originalStartAR = window.startAR;
        
        // แทนที่ด้วยเวอร์ชัน enhanced
        window.startAR = async function(destinationName = "อาคารเรียน 6") {
            // ใช้ enhanced version
            return startAREnhanced(destinationName);
        };

        // เมื่อ AR เริ่มทำงาน ให้เรียกใช้ enhanced update loop
        // ในฟังก์ชัน startAR เดิม ให้เพิ่มบรรทัดนี้หลังจากที่ AR เริ่มทำงาน:
        // enhancedARUpdateLoop();

        // เพิ่มฟังก์ชันสำหรับเปิดการตั้งค่า AR
        window.toggleARSettings = toggleARSettings;

        // ====== ฟังก์ชันสำหรับแสดง Grid ======
        function generateGrid() {
            const gridOverlay = document.getElementById('ar-grid-overlay');
            gridOverlay.innerHTML = '';
            
            const cellSize = 50; // พิกเซล
            
            // สร้างเส้นแนวนอน
            for (let y = 0; y < window.innerHeight; y += cellSize) {
                const line = document.createElement('div');
                line.className = 'ar-grid-line horizontal';
                line.style.top = `${y}px`;
                gridOverlay.appendChild(line);
            }
            
            // สร้างเส้นแนวตั้ง
            for (let x = 0; x < window.innerWidth; x += cellSize) {
                const line = document.createElement('div');
                line.className = 'ar-grid-line vertical';
                line.style.left = `${x}px`;
                gridOverlay.appendChild(line);
            }
        }

        // เมื่อ resize หน้าต่าง ให้สร้าง grid ใหม่
        window.addEventListener('resize', generateGrid);

        console.log('Enhanced AR System loaded successfully');
    </script>
</body>
</html>
